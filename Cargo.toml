[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "1.3.2"
edition = "2021"
license = "MIT"
homepage = "https://phv-lang.org"
documentation = "https://phv-lang.org"

[workspace.dependencies]
phv_syntax = { path = "crates/phv_syntax" }
phv_types = { path = "crates/phv_types" }
phv_compiler = { path = "crates/phv_compiler" }
phv_vm = { path = "crates/phv_vm" }
phv_std = { path = "crates/phv_std" }
phv_driver = { path = "crates/phv_driver" }
phv_server = { path = "crates/phv_server" }
phv_jit = { path = "crates/phv_jit" }

indexmap = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "fs", "sync", "signal"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
httpdate = "1"
form_urlencoded = "1"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
argon2 = "0.5"
base64 = "0.22"
rusqlite = { version = "=0.41.0", features = ["bundled", "limits", "hooks", "functions"] }
toml = "0.9"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
postgres = { version = "0.19.14", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = "0.14.0"
tokio-postgres = "0.7.18"
futures-util = { version = "0.3", default-features = false }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.10"
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pki-types = "1.15"
regex = "1"
regex-automata = { version = "0.4", default-features = false, features = ["std", "syntax", "nfa-thompson"] }
url = "2"
chrono-tz = "0.10"
ring = "0.17"
# Already built for mysql: checks the points of EC and Ed25519 JWT keys at load.
num-bigint = { version = "0.4", default-features = false, features = ["std"] }
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
httparse = "1.10"
# The allocator under the counting allocator (crates/phv_vm/src/alloc.rs).
# Both crates are pinned exactly: the sys crate vendors mimalloc's C sources
# (3.3.2 in 0.1.49), so moving it means a new C library in the binary, which
# is reviewed like any other dependency change. No features: not `secure`
# (the per-script memory limit is the defence that matters here, and the
# hardened mode costs about a tenth of the allocator's speed), not `override`
# (Rust's allocations all go through `CountingAlloc`; C code with its own
# malloc, such as SQLite, is routed to it explicitly).
mimalloc = { version = "=0.1.52", default-features = false }
libmimalloc-sys = { version = "=0.1.49", default-features = false }
# std.image: PNG, JPEG, GIF and WebP in pure Rust (png, zune-jpeg, gif,
# image-webp), pinned exactly with only these codecs: no rayon (a page's work
# stays on its own thread, where its time and memory are counted), no C.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# The JPEG decoder `image` uses, called directly: its own header parse tells a
# progressive JPEG apart, and its limit of scans is set from the caps. The
# same version and features as through `image`, so nothing more is built.
zune-jpeg = "=0.5.15"

[profile.release]
# Arithmetic bugs in the runtime become caught panics instead of silent wraps.
overflow-checks = true
codegen-units = 1
# Whole-program optimization; the symbols stay so a caught panic's trace has names.
lto = "fat"
strip = "debuginfo"
