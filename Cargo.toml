[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
phenix_syntax = { path = "crates/phenix_syntax" }
phenix_types = { path = "crates/phenix_types" }
phenix_compiler = { path = "crates/phenix_compiler" }
phenix_vm = { path = "crates/phenix_vm" }
phenix_std = { path = "crates/phenix_std" }
phenix_driver = { path = "crates/phenix_driver" }
phenix_server = { path = "crates/phenix_server" }
phenix_jit = { path = "crates/phenix_jit" }

indexmap = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "fs"] }
form_urlencoded = "1"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
sha2 = "0.10"
hmac = "0.12"
argon2 = "0.5"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled", "limits"] }
toml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc"] }

[profile.release]
codegen-units = 1
lto = "thin"
