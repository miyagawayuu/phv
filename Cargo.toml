[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.2.7"
edition = "2021"
license = "MIT"
homepage = "https://phx-lang.org"
documentation = "https://phx-lang.org"

[workspace.dependencies]
phx_syntax = { path = "crates/phx_syntax" }
phx_types = { path = "crates/phx_types" }
phx_compiler = { path = "crates/phx_compiler" }
phx_vm = { path = "crates/phx_vm" }
phx_std = { path = "crates/phx_std" }
phx_driver = { path = "crates/phx_driver" }
phx_server = { path = "crates/phx_server" }
phx_jit = { path = "crates/phx_jit" }

indexmap = { version = "2", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "fs", "sync"] }
form_urlencoded = "1"
percent-encoding = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
getrandom = "0.3"
sha2 = "0.10"
hmac = "0.12"
sha1 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
argon2 = "0.5"
base64 = "0.22"
rusqlite = { version = "0.37", features = ["bundled", "limits", "hooks"] }
toml = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", default-features = false, features = ["use-std"] }
postgres = { version = "0.19.14", features = ["with-chrono-0_4"] }
tokio-postgres-rustls = "0.14.0"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "1.0.10"
mysql = { version = "28.0.4", default-features = false, features = ["minimal-rust", "rustls-tls-ring"] }
redis = { version = "1.7.1", default-features = false, features = ["tls-rustls", "tls-rustls-webpki-roots"] }

[profile.release]
# Arithmetic bugs in the runtime become caught panics instead of silent wraps.
overflow-checks = true
codegen-units = 1
lto = "thin"
