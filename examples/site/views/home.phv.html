<?phv
import lib.posts.Post;
params(string $name, list<Post> $posts);
?>
<section class="hero">
  <h1>Hello, <?= $name ?>!</h1>
  <form method="get" action="/">
    <label for="name">Your name</label>
    <input id="name" name="name" value="<?= $name ?>" autocomplete="off">
    <button>Greet me</button>
  </form>
</section>

<h2>Posts</h2>
<?phv foreach ($posts as $post): ?>
<article class="card">
  <h3><a href="/post?id=<?= $post->id ?>"><?= $post->title ?></a></h3>
  <p><?= $post->excerpt() ?></p>
  <p class="tags"><?phv foreach ($post->tags as $tag): ?><span>#<?= $tag ?></span><?phv endforeach; ?></p>
</article>
<?phv endforeach; ?>
