<?phv
import lib.guestbook.Entry;
params(list<Entry> $entries, string $name, string $message, list<string> $errors, ?string $notice);
?>
<h1>Guestbook</h1>
<p>Stored in SQLite. Every value goes into the query as a parameter, so quotes and
<code>&lt;script&gt;</code> tags are just text.</p>

<?phv if ($notice != null): ?>
<div class="notice ok"><?= $notice ?></div>
<?phv endif; ?>
<?phv if (!$errors->isEmpty()): ?>
<ul class="notice error">
<?phv foreach ($errors as $error): ?>
  <li><?= $error ?></li>
<?phv endforeach; ?>
</ul>
<?phv endif; ?>

<form method="post" action="/guestbook" class="stack">
  <?= csrf_field() ?>
  <label for="name">Name</label>
  <input id="name" name="name" value="<?= $name ?>" maxlength="40">
  <label for="message">Message</label>
  <textarea id="message" name="message" rows="3" maxlength="500"><?= $message ?></textarea>
  <button>Sign</button>
</form>

<?phv foreach ($entries as $entry): ?>
<article class="card">
  <p><strong><?= $entry->name ?></strong> <span class="tags"><?= $entry->createdAt ?> UTC</span></p>
  <p><?= nl2br($entry->message) ?></p>
</article>
<?phv endforeach; ?>
<?phv if ($entries->isEmpty()): ?>
<p>No entries yet. Be the first!</p>
<?phv endif; ?>
