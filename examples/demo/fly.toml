# Fly.io settings for https://demo.phx-lang.org (deploy with `fly deploy` from this directory).

app = "phx-demo"
primary_region = "nrt"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  # Stop the machine when nobody is visiting; the next request starts it again.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "requests"
    soft_limit = 20
    hard_limit = 40

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/clicks"
    timeout = "5s"

# SQLite (message board and click counter). A volume belongs to one machine,
# so the demo runs on a single machine.
[mounts]
  source = "phx_demo_data"
  destination = "/app/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
