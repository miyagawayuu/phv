# The default catalog: every key is here.
welcome = "Welcome, {name}!"
title = "Shop"
markup = "<b>Bold</b> & {name}"
terms = "I accept the {link} of {site}."
braces = "{{literal}} braces"

[cart]
empty = "Your cart is empty."

[cart.items]
one = "{count} item"
