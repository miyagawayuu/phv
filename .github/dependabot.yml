# Keeps the GitHub Actions used by the workflows (pinned to commit SHAs, with
# the version in a comment), the demo's base image and the website's deploy
# tooling up to date.
# Security updates for the Cargo and npm dependencies are turned on in the
# repository settings and need no entry here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # The demo's base image, pinned by digest in examples/demo/Dockerfile. It
  # stays on the Ubuntu release the release binary is built on (24.04): only
  # new digests of it are proposed.
  - package-ecosystem: docker
    directory: /examples/demo
    schedule:
      interval: weekly
    ignore:
      - dependency-name: ubuntu
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
  # wrangler, installed by the website workflow's deploy job from this lockfile.
  - package-ecosystem: npm
    directory: /.github/deploy
    schedule:
      interval: weekly
    groups:
      deploy:
        patterns: ["*"]
