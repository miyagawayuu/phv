name: Release

# Pushing a tag `vX.Y.Z` builds `phv` for every platform and the VS Code
# extension (`phv-X.Y.Z.vsix`), and creates a *draft* GitHub release with them
# and their SHA-256 checksums; it is published by hand after checking it. Running the workflow by hand (Actions
# tab, or `gh workflow run release.yml`) only builds and tests the archives.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, native: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, native: true }
          - { os: macos-latest, target: aarch64-apple-darwin, native: true }
          - { os: macos-latest, target: x86_64-apple-darwin, native: false }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi
      - name: Build
        run: cargo build --release --locked -p phv_cli --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.native
        run: |
          bin=target/${{ matrix.target }}/release/phv
          "$bin" --version
          out=$("$bin" run examples/hello/hello.phv)
          echo "$out"
          test -n "$out"
      - name: Package
        run: |
          name=phv-${{ steps.version.outputs.version }}-${{ matrix.target }}
          mkdir -p "dist/$name"
          exe=phv
          [[ "${{ matrix.target }}" == *windows* ]] && exe=phv.exe
          cp "target/${{ matrix.target }}/release/$exe" LICENSE README.md README.ja.md SECURITY.md "dist/$name/"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
          ls -l
      - uses: actions/upload-artifact@v7
        with:
          name: phv-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  extension:
    name: build (VS Code extension)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          ext=$(node -p 'require("./editors/vscode/package.json").version')
          if [[ "$ext" != "$version" ]]; then
            echo "::error::editors/vscode/package.json is $ext but Cargo.toml is $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Test and package
        working-directory: editors/vscode
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          mkdir -p ../../dist
          npx vsce package --out "../../dist/phv-${{ steps.version.outputs.version }}.vsix"
      - name: Check the package
        run: |
          # extension.js loads vscode-languageclient at run time, so it must be in the package.
          unzip -l dist/*.vsix | grep -q "extension/node_modules/vscode-languageclient/package.json"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: phv-vscode
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    name: draft release
    needs: [build, extension]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            --title "PHV $GITHUB_REF_NAME" \
            --generate-notes
