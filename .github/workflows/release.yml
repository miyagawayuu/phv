name: Release

# Pushing a tag `vX.Y.Z` builds `phv` for every platform and the VS Code
# extension (`phv-X.Y.Z.vsix`), and creates a *draft* GitHub release with them
# and their SHA-256 checksums; it is published by hand after checking it. Running the workflow by hand (Actions
# tab, or `gh workflow run release.yml`) only builds and tests the archives.
# The static (musl) builds also go into the Docker image, which is tested here
# and pushed by docker.yml once the release is published.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, native: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, native: true }
          # Static executables (no C library needed), also used by the Docker image.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, native: true, musl: true }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, native: true, musl: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, native: true }
          - { os: macos-latest, target: aarch64-apple-darwin, native: true }
          - { os: macos-latest, target: x86_64-apple-darwin, native: false }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: musl C compiler (SQLite and ring are C)
        if: matrix.musl
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the version in Cargo.toml ($version)"
            exit 1
          fi
      - name: Build
        run: cargo build --release --locked -p phv_cli --target ${{ matrix.target }}
      - name: Smoke test
        if: matrix.native
        run: |
          bin=target/${{ matrix.target }}/release/phv
          "$bin" --version
          out=$("$bin" run examples/hello/hello.phv)
          echo "$out"
          test -n "$out"
      - name: Check that it is static
        if: matrix.musl
        run: |
          info=$(file target/${{ matrix.target }}/release/phv)
          echo "$info"
          echo "$info" | grep -Eq "statically linked|static-pie linked"
      - name: Package
        run: |
          name=phv-${{ steps.version.outputs.version }}-${{ matrix.target }}
          mkdir -p "dist/$name"
          exe=phv
          [[ "${{ matrix.target }}" == *windows* ]] && exe=phv.exe
          cp "target/${{ matrix.target }}/release/$exe" LICENSE README.md README.ja.md SECURITY.md "dist/$name/"
          # The licence notices of the crates built into phv for this target
          # (the BSD and Apache licences ask for them with the binary). The
          # script fails when a crate has none.
          py=python3
          command -v python3 > /dev/null || py=python
          "$py" packaging/licenses.py ${{ matrix.target }} "dist/$name/THIRD-PARTY-LICENSES.txt"
          grep -q "^  moxcms " "dist/$name/THIRD-PARTY-LICENSES.txt"
          cd dist
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$name.zip" "$name" > /dev/null
          else
            tar -czf "$name.tar.gz" "$name"
          fi
          rm -r "$name"
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phv-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  docker:
    name: test the Docker image
    needs: [build]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: phv-x86_64-unknown-linux-musl
          path: dist
      - name: Build and run the image (amd64; docker.yml pushes both architectures)
        run: |
          mkdir -p ctx/amd64 ctx/tmp
          tar -xzf dist/*.tar.gz -C dist
          cp dist/phv-*/phv dist/phv-*/THIRD-PARTY-LICENSES.txt ctx/amd64/
          cp LICENSE docker/Dockerfile ctx/
          docker buildx build --platform linux/amd64 --load -t phv-test ctx
          docker run --rm phv-test --version
          # The licence notices are in the image.
          docker create --name phv-files phv-test
          docker cp phv-files:/usr/share/licenses/phv/THIRD-PARTY-LICENSES.txt notices.txt
          docker cp phv-files:/usr/share/licenses/phv/LICENSE license.txt
          docker rm phv-files
          cmp notices.txt ctx/amd64/THIRD-PARTY-LICENSES.txt
          cmp license.txt LICENSE
          docker run --rm -v "$PWD/examples/hello:/app" --user "$(id -u):$(id -g)" phv-test run hello.phv

  extension:
    name: build (VS Code extension)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)
          ext=$(node -p 'require("./editors/vscode/package.json").version')
          if [[ "$ext" != "$version" ]]; then
            echo "::error::editors/vscode/package.json is $ext but Cargo.toml is $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Test and package
        working-directory: editors/vscode
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test
          mkdir -p ../../dist
          npx vsce package --out "../../dist/phv-${{ steps.version.outputs.version }}.vsix"
      - name: Check the package
        run: |
          # extension.js loads vscode-languageclient at run time, so it must be in the package.
          unzip -l dist/*.vsix | grep -q "extension/node_modules/vscode-languageclient/package.json"
          ls -l dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: phv-vscode
          path: dist/*.vsix
          if-no-files-found: error

  publish:
    name: draft release
    needs: [build, extension, docker]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS
          cat SHA256SUMS
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --draft \
            --title "PHV $GITHUB_REF_NAME" \
            --generate-notes
