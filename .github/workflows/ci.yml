name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository. Only GitHub's own actions are used
# (the Rust toolchain comes from rustup on the runner), and checkout does not
# leave the token in .git/config for later steps to read.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (golden, JIT, formatting, HTTP, fuzz, unit)
        run: cargo test --workspace
      - name: Phenix formatting and tests of the examples
        shell: bash
        run: |
          cargo build --release
          ./target/release/phenix fmt --check examples
          ./target/release/phenix test examples
          ./target/release/phenix check examples/site/public/index.phx

  fuzz:
    name: longer fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --release -p phenix_driver --test fuzz
        env:
          PHENIX_FUZZ_ITERATIONS: "1000"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo install cargo-audit --locked
      # Fails on known vulnerabilities and on unmaintained or yanked crates.
      - run: cargo audit --deny warnings
