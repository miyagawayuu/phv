name: CI

on:
  push:
  pull_request:

# The workflow only reads the repository. Only GitHub's own actions are used
# (the Rust toolchain comes from rustup on the runner), and checkout does not
# leave the token in .git/config for later steps to read.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  databases:
    name: databases (PostgreSQL, MySQL, Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: phv
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 2s --health-retries 30
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: phv
          MYSQL_DATABASE: phv
        ports: ["3306:3306"]
        options: --health-cmd "mysqladmin ping -h 127.0.0.1 -pphv" --health-interval 2s --health-retries 60
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-db-${{ hashFiles('Cargo.lock') }}
      - name: Tests against the servers
        env:
          PHV_TEST_POSTGRES_URL: postgres://postgres:phv@127.0.0.1/postgres
          PHV_TEST_MYSQL_URL: mysql://root:phv@127.0.0.1/phv
          PHV_TEST_REDIS_URL: redis://127.0.0.1
        run: cargo test -p phv_driver --test databases -- --nocapture

  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Rust toolchain
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Rust formatting
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (golden, JIT, formatting, HTTP, fuzz, unit)
        run: cargo test --workspace
      - name: PHV formatting and tests of the examples
        shell: bash
        run: |
          cargo build --release
          ./target/release/phv fmt --check examples
          ./target/release/phv test examples
          ./target/release/phv check examples/site/public/index.phv
      - name: Website samples match the compiler
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ./target/release/phv check website/samples/hero.phv
          ./target/release/phv check website/samples/profile.phv > profile.out 2>&1 && exit 1
          diff -u website/samples/profile.err profile.out

  editor:
    name: VS Code extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Grammar tests
        working-directory: editors/vscode
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm test

  website:
    name: website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build phv-lang.org
        working-directory: website
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build

  fuzz:
    name: longer fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo test --release -p phv_driver --test fuzz
        env:
          PHV_FUZZ_ITERATIONS: "1000"

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo install cargo-audit --locked
      # Fails on known vulnerabilities and on unmaintained or yanked crates.
      - run: cargo audit --deny warnings
