name: Publish VS Code extension

# Publishes the release's phv-X.Y.Z.vsix to the Visual Studio Marketplace when
# a release is published (after the draft has been checked). Authentication is
# Marketplace Trusted Publishing: GitHub's OIDC token proves this repository,
# this workflow file and the `marketplace` environment, so no token is stored.
# Run it by hand with a tag to publish an earlier release's extension.
#
# Every step of this job can ask for the OIDC token, so nothing here runs code
# that is not pinned: vsce comes from editors/vscode/package-lock.json of the
# released tag, installed without install scripts.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag whose .vsix to publish (e.g. v0.2.3)"
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The tag, never a branch of the same name (whose lockfile would choose vsce).
          ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
          persist-credentials: false
      - name: Check the tag
        env:
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::not a release tag: $TAG"; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$TAG^{commit}")"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Download the .vsix from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern 'phv-*.vsix' --pattern SHA256SUMS --dir dist
          ls -l dist
          # The release must contain exactly one extension package, and it must
          # match the checksum the release workflow recorded.
          test "$(ls dist/*.vsix | wc -l)" -eq 1
          cd dist && grep ' phv-[0-9.]*\.vsix$' SHA256SUMS | sha256sum -c -
      - name: Install the pinned vsce
        working-directory: editors/vscode
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Publish to the Visual Studio Marketplace
        working-directory: editors/vscode
        run: npx --no-install vsce publish --oidc --packagePath ../../dist/*.vsix
