name: Website

# Builds phv-lang.org and deploys it to Cloudflare Pages (project `phv-lang`).
# Needs two repository secrets: CLOUDFLARE_API_TOKEN (a token with the
# "Cloudflare Pages: Edit" permission) and CLOUDFLARE_ACCOUNT_ID. Without them
# the site is still built, and the deploy step is skipped.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "editors/vscode/syntaxes/**"
      - "Cargo.toml"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  # The build and the deploy are separate jobs: the build runs the site's npm
  # packages without the Cloudflare token, and the deploy job (which has the
  # token) has no checkout or node_modules the build could have changed.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build
        working-directory: website
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: website/dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID are not set; skipping the deploy"
            exit 0
          fi
          # Checks that explain a failure without printing either secret.
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID should be 32 hex characters (it has ${#CLOUDFLARE_ACCOUNT_ID}); copy it again from the dashboard"
            exit 1
          fi
          api() { curl -sS -o /tmp/cf.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1"; }
          echo "token verify: HTTP $(api user/tokens/verify), $(jq -c '{success, status: .result.status, errors: [.errors[]?.code]}' /tmp/cf.json)"
          echo "pages projects: HTTP $(api accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects), $(jq -c '{success, errors: [.errors[]? | {code, message}], projects: [.result[]?.name]}' /tmp/cf.json)"

          wrangler="npx --yes wrangler@4.151.1"
          # The first deploy creates the project; later runs find it.
          if ! jq -e '.result[]? | select(.name == "phv-lang")' /tmp/cf.json > /dev/null; then
            $wrangler pages project create phv-lang --production-branch main
          fi
          $wrangler pages deploy dist --project-name phv-lang --branch main --commit-dirty=true
