name: Website

# Builds phv-lang.org and deploys it to Cloudflare Pages (project `phv-lang`).
# The main-only website-production environment holds PHV_WEBSITE_API_TOKEN
# (Cloudflare Pages: Edit) and PHV_WEBSITE_ACCOUNT_ID. Without them the site
# is still built, and the deploy step is skipped.
on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "docs/**"
      - "editors/vscode/syntaxes/**"
      - "Cargo.toml"
      - ".github/workflows/website.yml"
      - ".github/deploy/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website
  cancel-in-progress: false

jobs:
  # The build and the deploy are separate jobs: the build runs the site's npm
  # packages without the Cloudflare token, and the deploy job (which has the
  # token) has no checkout or node_modules the build could have changed. It
  # checks out only .github/deploy and installs wrangler from that lockfile,
  # with install scripts off and before the token is in the environment.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        working-directory: website
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: website/dist
          retention-days: 1

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    environment: website-production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: /.github/deploy/
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: dist
      - name: Install wrangler
        working-directory: .github/deploy
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Deploy to Cloudflare Pages
        working-directory: .github/deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.PHV_WEBSITE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.PHV_WEBSITE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::notice::PHV_WEBSITE_API_TOKEN / PHV_WEBSITE_ACCOUNT_ID are not set in website-production; skipping the deploy"
            exit 0
          fi
          # Checks that explain a failure without printing either secret.
          if ! [[ "$CLOUDFLARE_ACCOUNT_ID" =~ ^[0-9a-f]{32}$ ]]; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID should be 32 hex characters (it has ${#CLOUDFLARE_ACCOUNT_ID}); copy it again from the dashboard"
            exit 1
          fi
          api() { curl -sS -o /tmp/cf.json -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/$1"; }
          echo "token verify: HTTP $(api user/tokens/verify), $(jq -c '{success, status: .result.status, errors: [.errors[]?.code]}' /tmp/cf.json)"
          echo "pages projects: HTTP $(api accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects), $(jq -c '{success, errors: [.errors[]? | {code, message}], projects: [.result[]?.name]}' /tmp/cf.json)"

          # Only the wrangler that npm ci installed from the lockfile.
          wrangler="npx --no-install wrangler"
          # The first deploy creates the project; later runs find it.
          if ! jq -e '.result[]? | select(.name == "phv-lang")' /tmp/cf.json > /dev/null; then
            $wrangler pages project create phv-lang --production-branch main
          fi
          $wrangler pages deploy "$GITHUB_WORKSPACE/dist" --project-name phv-lang --branch main --commit-dirty=true
